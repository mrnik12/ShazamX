name: Publish ShazamX 0.4.0
on:
  push:
    branches:
      - publish-0.4.0
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify and upload the release DEB
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mrnik12/ShazamX
        run: |
          set -euo pipefail
          asset=org.legacyshazam.smoke_0.4.0_iphoneos-arm.deb
          curl --fail --silent --show-error --location --retry 3 --output "$asset" \
            "https://raw.githubusercontent.com/mrnik12/repo/f63bbed6ca028d503cdc5edb5522fa9282674f82/debs/$asset"
          printf '%s  %s\n' '6c356ff16e0b54c0750048fc885d78947d2b31da65530c6160b57690ad7747c6' "$asset" | sha256sum --check
          cat >release-notes.md <<'NOTES'
          - On Shazam 7.2.0, Add to Tags saves the song and takes you to My Tags. Saved tags reopen with their cached art.
          - On Shazam 5.5.1, My Tags keeps thumbnails aligned and reuses smaller images when scrolling.
          - Canceling during Sending on 7.2.0 stops the active WebKit request so you can tag again immediately.

          Supports Shazam 5.5.1 on iOS 6 and Shazam 7.2.0 on iOS 7. Netrun is the default. Render stays available in Settings.
          NOTES
          gh release create 0.4.0 "$asset" --target 4971e64a44c224c4d39a4e36d9eff0311a128f89 --title 'ShazamX 0.4.0' --notes-file release-notes.md --latest
